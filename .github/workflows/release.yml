name: Build & Release

on:
  push:
    tags:
      - 'v*.*.*'
    paths-ignore:
      - '*.md'
      - 'LICENSE'
  pull_request:
    paths-ignore:
      - '*.md'
      - 'LICENSE'
  workflow_dispatch:

env:
  RUSTC_WRAPPER: "sccache"
  SENTRY_DSN: ${{ secrets.SENTRY_DSN }}

jobs:
  build-linux:
    name: Build Linux (${{matrix.name}})
    runs-on: ${{matrix.runner}}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: GCC x86_64
            runner: ubuntu-22.04
            preset: gcc

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: true          # Changed to true (recursive can cause issues)
          # Or use: submodules: 'recursive'

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ninja-build clang lld libfuse2 \
            libcurl4-openssl-dev libssl-dev libglu1-mesa-dev libasound2-dev \
            libpulse-dev libudev-dev libx11-xcb-dev libxrandr-dev libxi-dev \
            libxcursor-dev libxinerama-dev libdbus-1-dev libpng-dev

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Configure
        run: cmake --preset x-linux-ci-${{matrix.preset}}

      - name: Build
        run: cmake --build --preset x-linux-ci-${{matrix.preset}}

  # Add other jobs (macOS, Windows, Android) only after Linux works
