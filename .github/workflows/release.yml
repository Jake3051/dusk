name: Build & Release

on:
  push:
    tags:
      - 'v*.*.*'
    paths-ignore:
      - '*.md'
      - 'LICENSE'
  pull_request:
    paths-ignore:
      - '*.md'
      - 'LICENSE'
  workflow_dispatch:

env:
  SCCACHE_GHA_ENABLED: "true"
  RUSTC_WRAPPER: "sccache"
  SENTRY_DSN: ${{ secrets.SENTRY_DSN }}

jobs:
  build-linux:
    name: Build Linux (x86_64)
    runs-on: self-hosted

  build-macos:
    name: Build macOS (arm64)
    runs-on: self-hosted

  build-windows:
    name: Build Windows (MSVC x86_64)
    runs-on: self-hosted

  build-android:
    name: Build Android (arm64-v8a, x86_64)
    runs-on: self-hosted

    env:
      ANDROID_NDK_VERSION: 29.0.14206865
      RUSTC_WRAPPER:
      ANDROID_STAGE_STRIP: 0

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0 ndk;29.0.14206865'

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ninja-build

      - name: Install Rust Android targets
        run: |
          rustup target add aarch64-linux-android x86_64-linux-android

      - name: Build native libs (arm64-v8a)
        run: |
          cmake --preset android-arm64
          cmake --build --preset android-arm64

      - name: Build native libs (x86_64)
        run: |
          cmake --preset android-x86_64
          cmake --build --preset android-x86_64

      - name: Stage JNI libs
        run: ./platforms/android/scripts/stage-jni-libs.sh

      - name: Assemble APK
        working-directory: platforms/android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dusk-${{env.DUSK_VERSION}}-android
          path: platforms/android/app/build/outputs/apk/debug/*.apk
