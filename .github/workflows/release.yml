name: Build & Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:

  # ---------------------------------------------------------------------------
  # Linux
  # ---------------------------------------------------------------------------
  build-linux:
    name: Linux (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
          - arch: arm64
            runner: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build \
            libvulkan-dev glslang-tools \
            libx11-dev libxext-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxi-dev libxxf86vm-dev \
            libwayland-dev libwayland-egl-backend-dev libxkbcommon-dev \
            libasound2-dev libpulse-dev libdbus-1-dev \
            libgl-dev libegl-dev libgles-dev

      - name: Configure
        run: cmake --preset linux-default-relwithdebinfo

      - name: Build
        run: cmake --build --preset linux-default-relwithdebinfo --parallel

      - name: Package
        run: |
          cmake --install build/linux-default-relwithdebinfo --prefix build/install
          cd build
          zip -r "Dusk-${{ github.ref_name }}-linux-${{ matrix.arch }}.zip" install/

      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: build/Dusk-*.zip

  # ---------------------------------------------------------------------------
  # Windows
  # ---------------------------------------------------------------------------
  build-windows:
    name: Windows (x86_64)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure
        run: cmake --preset windows-msvc-relwithdebinfo

      - name: Build
        run: cmake --build --preset windows-msvc-relwithdebinfo --parallel

      - name: Package
        shell: pwsh
        run: |
          cmake --install build/windows-msvc-relwithdebinfo --prefix build/install
          $tag = "${{ github.ref_name }}"
          Compress-Archive -Path build/install/* -DestinationPath "build/Dusk-${tag}-win32-x86_64.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: windows-x86_64
          path: build/Dusk-*.zip

  # ---------------------------------------------------------------------------
  # macOS
  # ---------------------------------------------------------------------------
  build-macos:
    name: macOS (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-latest
          - arch: x86_64
            runner: macos-13

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: brew install cmake ninja

      - name: Configure
        run: cmake --preset macos-default-relwithdebinfo

      - name: Build
        run: cmake --build --preset macos-default-relwithdebinfo --parallel

      - name: Package
        run: |
          cmake --install build/macos-default-relwithdebinfo --prefix build/install
          cd build
          zip -r "Dusk-${{ github.ref_name }}-macos-${{ matrix.arch }}.zip" install/

      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: build/Dusk-*.zip

  # ---------------------------------------------------------------------------
  # Android
  # ---------------------------------------------------------------------------
  build-android:
    name: Android (arm64)
    runs-on: ubuntu-latest
    env:
      ANDROID_NDK_VERSION: 27.2.12479018
      HAS_ANDROID_SIGNING: ${{ secrets.ANDROID_KEYSTORE != '' }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install NDK and CMake
        run: |
          sudo apt-get install -y cmake ninja-build
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "ndk;${{ env.ANDROID_NDK_VERSION }}" 2>/dev/null

      - name: Build native library (arm64)
        run: |
          cmake --preset android-arm64
          cmake --build --preset android-arm64 --parallel

      - name: Stage JNI libs
        run: ANDROID_STAGE_ABIS=arm64-v8a platforms/android/scripts/stage-jni-libs.sh

      - name: Build APK
        run: cd platforms/android && ./gradlew assembleRelease

      - name: Sign APK
        if: env.HAS_ANDROID_SIGNING == 'true'
        run: |
          APK=$(find platforms/android/app/build/outputs/apk -name "*arm64*release*.apk" | head -1)
          echo "${{ secrets.ANDROID_KEYSTORE }}" | base64 -d > release.keystore
          BUILD_TOOLS=$ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | sort -V | tail -1)
          $BUILD_TOOLS/apksigner sign \
            --ks release.keystore \
            --ks-pass "pass:${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
            --key-pass "pass:${{ secrets.ANDROID_KEY_PASSWORD }}" \
            --ks-key-alias "${{ secrets.ANDROID_KEY_ALIAS }}" \
            --out "build/Dusk-${{ github.ref_name }}-android-arm64.apk" \
            "$APK"

      - name: Collect unsigned APK (no signing secrets)
        if: env.HAS_ANDROID_SIGNING != 'true'
        run: |
          APK=$(find platforms/android/app/build/outputs/apk -name "*arm64*release*.apk" | head -1)
          cp "$APK" "build/Dusk-${{ github.ref_name }}-android-arm64.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: android-arm64
          path: build/Dusk-*.apk

  # ---------------------------------------------------------------------------
  # iOS
  # Requires secrets: IOS_CERTIFICATE (base64 p12), IOS_CERTIFICATE_PASSWORD,
  # IOS_PROVISIONING_PROFILE (base64 mobileprovision), IOS_TEAM_ID
  # ---------------------------------------------------------------------------
  build-ios:
    name: iOS (arm64)
    runs-on: macos-latest
    continue-on-error: true
    env:
      HAS_IOS_CERT: ${{ secrets.IOS_CERTIFICATE != '' }}
      HAS_IOS_PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE != '' }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: brew install cmake ninja

      - name: Import signing certificate
        if: env.HAS_IOS_CERT == 'true'
        run: |
          echo "${{ secrets.IOS_CERTIFICATE }}" | base64 -d > cert.p12
          security create-keychain -p "" build.keychain
          security import cert.p12 -k build.keychain \
            -P "${{ secrets.IOS_CERTIFICATE_PASSWORD }}" \
            -T /usr/bin/codesign
          security list-keychains -s build.keychain
          security set-key-partition-list -S apple-tool:,apple: -s \
            -k "" build.keychain

      - name: Install provisioning profile
        if: env.HAS_IOS_PROFILE == 'true'
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "${{ secrets.IOS_PROVISIONING_PROFILE }}" | base64 -d \
            > ~/Library/MobileDevice/Provisioning\ Profiles/dusk.mobileprovision

      - name: Configure
        run: cmake --preset ios-default

      - name: Build
        run: cmake --build --preset ios-default --parallel

      - name: Create IPA
        run: |
          TAG=${{ github.ref_name }}
          cmake --install build/ios-default --prefix build/install-ios
          APP=$(find build/install-ios -name "*.app" | head -1)
          mkdir -p build/ipa-payload/Payload
          cp -r "$APP" build/ipa-payload/Payload/
          cd build/ipa-payload
          zip -r "../Dusk-${TAG}-ios-arm64.ipa" Payload/

      - uses: actions/upload-artifact@v4
        with:
          name: ios-arm64
          path: build/Dusk-*.ipa

  # ---------------------------------------------------------------------------
  # Create release from all artifacts
  # ---------------------------------------------------------------------------
  release:
    name: Create Release
    needs: [build-linux, build-windows, build-macos, build-android, build-ios]
    runs-on: ubuntu-latest
    # Run as long as at least one platform succeeded
    if: |
      always() && (
        needs.build-linux.result    == 'success' ||
        needs.build-windows.result  == 'success' ||
        needs.build-macos.result    == 'success' ||
        needs.build-android.result  == 'success'
      )
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate SHA-256 checksums
        run: |
          cd artifacts
          for f in *.zip *.apk *.ipa; do
            [ -f "$f" ] && sha256sum "$f" > "$f.sha256"
          done

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          draft: true
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') }}
          body: |
            <!-- Add your release notes here before publishing -->

            > [!IMPORTANT]
            > Dusk does *not* include any copyrighted game assets. You must provide your own supported copy of Twilight Princess. See the [setup guide](README.md#setup) for details.
          files: artifacts/*
