name: Build & Release

on:
  push:
    tags:
      - 'v*.*.*'
    paths-ignore:
      - '*.md'
      - 'LICENSE'
  pull_request:
    paths-ignore:
      - '*.md'
      - 'LICENSE'
  workflow_dispatch:

env:
  RUSTC_WRAPPER: "sccache"
  SENTRY_DSN: ${{ secrets.SENTRY_DSN }}

jobs:
  build-linux:
    name: Build Linux (x86_64)
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: true        # Simplified
          # Alternative if needed: submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ninja-build clang lld libfuse2 \
            libcurl4-openssl-dev libssl-dev libglu1-mesa-dev libasound2-dev \
            libpulse-dev libudev-dev libx11-xcb-dev libxrandr-dev libxi-dev \
            libxcursor-dev libxinerama-dev libdbus-1-dev libpng-dev

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Configure
        run: cmake --preset x-linux-ci-gcc

      - name: Build
        run: cmake --build --preset x-linux-ci-gcc
